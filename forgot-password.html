<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password – RAIL</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ============================
               RESET & BASE
            ============================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #f0f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ============================
               MAIN CARD
            ============================ */
        .forgot-container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
            padding: 40px 36px 32px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* subtle top accent */
        .forgot-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #f39c12, #e67e22, #f39c12);
            background-size: 200% 100%;
            animation: shimmer 3s infinite linear;
        }

        @keyframes shimmer {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: 200% 0%;
            }
        }

        /* ============================
               HEADER
            ============================ */
        .forgot-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .forgot-header .logo-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 2px;
        }

        .forgot-header h1 {
            font-size: 24px;
            font-weight: 800;
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        .forgot-header h1 span {
            color: #f39c12;
        }

        .forgot-header .sub {
            font-size: 14px;
            color: #6c757d;
            line-height: 1.5;
        }

        .forgot-header .sub i {
            color: #f39c12;
            margin-right: 4px;
        }

        /* ============================
               ICON
            ============================ */
        .forgot-icon {
            text-align: center;
            margin-bottom: 20px;
        }

        .forgot-icon .icon-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #d97706;
        }

        /* ============================
               FORM
            ============================ */
        .forgot-form {
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #343a40;
            margin-bottom: 6px;
        }

        .form-group label i {
            color: #f39c12;
            margin-right: 6px;
            width: 18px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e9ecef;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            color: #1a1a2e;
            background: #fafbfc;
            transition: all 0.25s ease;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .input-wrapper input:focus {
            border-color: #f39c12;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(243, 156, 18, 0.08);
        }

        .input-wrapper input::placeholder {
            color: #adb5bd;
            font-weight: 400;
        }

        /* ============================
               OTP SECTION
            ============================ */
        .otp-section {
            display: none;
            margin-top: 6px;
            animation: fadeUp 0.4s ease;
        }

        .otp-section.show {
            display: block;
        }

        .otp-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: end;
        }

        .otp-row .form-group {
            margin-bottom: 0;
            flex: 1;
        }

        .otp-row .btn-otp {
            padding: 14px 20px;
            background: #e9ecef;
            color: #1a1a2e;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
            height: 54px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .otp-row .btn-otp:hover {
            background: #dee2e6;
        }

        .otp-row .btn-otp:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .otp-timer {
            font-size: 13px;
            color: #6c757d;
            margin-top: 6px;
            display: none;
        }

        .otp-timer.show {
            display: block;
        }

        .otp-timer span {
            font-weight: 700;
            color: #d97706;
        }

        /* ============================
               BUTTONS
            ============================ */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #f39c12;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: #d97706;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(243, 156, 18, 0.30);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn-submit.loading .spinner {
            display: inline-block;
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================
               FORM ACTIONS
            ============================ */
        .form-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 18px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .form-actions .back-link {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .form-actions .back-link i {
            color: #f39c12;
            font-size: 14px;
        }

        .form-actions .back-link:hover {
            color: #f39c12;
        }

        .form-actions .help-link {
            font-size: 13px;
            font-weight: 500;
            color: #6c757d;
            text-decoration: none;
            transition: color 0.2s;
        }

        .form-actions .help-link:hover {
            color: #f39c12;
        }

        /* ============================
               TOAST MESSAGE
            ============================ */
        .toast-message {
            display: none;
            background: #1a1a2e;
            color: #fff;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-top: 16px;
            text-align: center;
            animation: fadeUp 0.3s ease;
        }

        .toast-message.show {
            display: block;
        }

        .toast-message i {
            margin-right: 8px;
        }

        .toast-message.success i {
            color: #2ecc71;
        }

        .toast-message.error i {
            color: #e63946;
        }

        .toast-message.info i {
            color: #f39c12;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================
               RESPONSIVE
            ============================ */
        @media (max-width: 480px) {
            .forgot-container {
                padding: 28px 20px 24px;
                border-radius: 20px;
            }

            .forgot-header h1 {
                font-size: 20px;
            }

            .otp-row {
                grid-template-columns: 1fr;
            }

            .otp-row .btn-otp {
                width: 100%;
                justify-content: center;
            }

            .form-actions {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="forgot-container">

        <!-- ====== HEADER ====== -->
        <div class="forgot-header">
            <span class="logo-icon">🚂</span>
            <h1>Indian <span>Railway</span></h1>
            <div class="sub"><i class="fas fa-chevron-circle-right"></i> Reset your password</div>
        </div>

        <!-- ====== ICON ====== -->
        <div class="forgot-icon">
            <div class="icon-circle">
                <i class="fas fa-key"></i>
            </div>
        </div>

        <!-- ====== FORGOT PASSWORD FORM ====== -->
        <form class="forgot-form" id="forgotForm" novalidate>

            <!-- Email / Username -->
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="Enter your registered email" required autocomplete="email" />
                </div>
            </div>

            <!-- OTP Section (hidden initially) -->
            <div class="otp-section" id="otpSection">
                <div class="otp-row">
                    <div class="form-group">
                        <label for="otp"><i class="fas fa-shield-alt"></i> OTP Code</label>
                        <div class="input-wrapper">
                            <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6" inputmode="numeric" />
                        </div>
                    </div>
                    <button type="button" class="btn-otp" id="otpBtn">
                        <i class="fas fa-paper-plane"></i> Send OTP
                    </button>
                </div>
                <div class="otp-timer" id="otpTimer">
                    <i class="fas fa-clock"></i> Resend in <span id="timerSeconds">60</span>s
                </div>
            </div>

            <!-- New Password (hidden initially) -->
            <div class="otp-section" id="newPasswordSection">
                <div class="form-group">
                    <label for="newPassword"><i class="fas fa-lock"></i> New Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="newPassword" placeholder="Min 8 characters" />
                        <i class="fas fa-eye toggle-pass" id="togglePass1" onclick="togglePassword('newPassword', 'togglePass1')" style="position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#adb5bd;cursor:pointer;"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword"><i class="fas fa-check-circle"></i> Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" placeholder="Re-enter new password" />
                        <i class="fas fa-eye toggle-pass" id="togglePass2" onclick="togglePassword('confirmPassword', 'togglePass2')" style="position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#adb5bd;cursor:pointer;"></i>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text"><i class="fas fa-arrow-right"></i> Reset Password</span>
                <span class="spinner"></span>
            </button>

            <!-- Form Actions -->
            <div class="form-actions">
                <a href="login.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
                <a href="#" class="help-link" onclick="alert('📞 Call 139 for help.')">
                    <i class="fas fa-headset"></i> Need help?
                </a>
            </div>

            <!-- Toast Message -->
            <div class="toast-message" id="toastMessage">
                <i class="fas fa-check-circle"></i> <span id="toastText">OTP sent successfully!</span>
            </div>

        </form>

    </div>

    <!-- ============================
    JAVASCRIPT
    ============================ -->
    <script>
        /**
         * Toggle password visibility
         */
        function togglePassword(inputId, toggleId) {
            const input = document.getElementById(inputId);
            const toggle = document.getElementById(toggleId);
            if (input.type === 'password') {
                input.type = 'text';
                toggle.classList.remove('fa-eye');
                toggle.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                toggle.classList.remove('fa-eye-slash');
                toggle.classList.add('fa-eye');
            }
        }

        /**
         * Show toast message
         */
        function showToast(message, type) {
            const toast = document.getElementById('toastMessage');
            const toastText = document.getElementById('toastText');

            toast.className = 'toast-message show ' + type;
            toastText.textContent = message;

            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        /**
         * OTP Timer
         */
        let timerInterval = null;
        let timerSeconds = 60;
        let otpSent = false;

        function startTimer() {
            const timerEl = document.getElementById('otpTimer');
            const secondsEl = document.getElementById('timerSeconds');
            const otpBtn = document.getElementById('otpBtn');

            timerSeconds = 60;
            secondsEl.textContent = timerSeconds;
            timerEl.classList.add('show');
            otpBtn.disabled = true;

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timerSeconds--;
                secondsEl.textContent = timerSeconds;

                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerEl.classList.remove('show');
                    otpBtn.disabled = false;
                    otpBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Resend OTP';
                }
            }, 1000);
        }

        /**
         * Send OTP
         */
        document.getElementById('otpBtn').addEventListener('click', function() {
            const email = document.getElementById('email').value.trim();

            if (!email) {
                showToast('Please enter your email address first.', 'error');
                document.getElementById('email').focus();
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                showToast('Please enter a valid email address.', 'error');
                document.getElementById('email').focus();
                return;
            }

            // Simulate OTP sending
            showToast('📩 OTP sent to ' + email, 'info');
            startTimer();
            otpSent = true;

            // Show OTP section
            document.getElementById('otpSection').classList.add('show');

            // Auto-focus OTP
            setTimeout(() => {
                document.getElementById('otp').focus();
            }, 300);

            this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            this.disabled = true;

            setTimeout(() => {
                this.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';
                this.disabled = false;
                showToast('✅ OTP sent! Check your email.', 'success');
            }, 2000);
        });

        /**
         * Handle form submission
         */
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const otp = document.getElementById('otp').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');

            // --- Step 1: Validate Email ---
            if (!email) {
                showToast('Please enter your email address.', 'error');
                document.getElementById('email').focus();
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                showToast('Please enter a valid email address.', 'error');
                document.getElementById('email').focus();
                return;
            }

            // --- Step 2: Check if OTP was sent ---
            if (!otpSent) {
                showToast('Please send OTP first.', 'error');
                document.getElementById('otpBtn').focus();
                return;
            }

            // --- Step 3: Validate OTP ---
            if (!otp) {
                showToast('Please enter the OTP.', 'error');
                document.getElementById('otp').focus();
                return;
            }

            if (otp.length < 6) {
                showToast('Please enter a valid 6-digit OTP.', 'error');
                document.getElementById('otp').focus();
                return;
            }

            // --- Step 4: Check if OTP is valid (simulate) ---
            if (otp !== '123456') {
                showToast('❌ Invalid OTP. Please try again.', 'error');
                document.getElementById('otp').focus();
                document.getElementById('otp').value = '';
                return;
            }

            // --- Step 5: Show new password fields ---
            document.getElementById('newPasswordSection').classList.add('show');

            // --- Step 6: Validate New Password ---
            if (!newPassword) {
                showToast('Please enter a new password.', 'error');
                document.getElementById('newPassword').focus();
                return;
            }

            if (newPassword.length < 8) {
                showToast('Password must be at least 8 characters.', 'error');
                document.getElementById('newPassword').focus();
                return;
            }

            if (newPassword !== confirmPassword) {
                showToast('Passwords do not match.', 'error');
                document.getElementById('confirmPassword').focus();
                return;
            }

            // --- Step 7: Submit (simulate) ---
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            setTimeout(() => {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;

                showToast('✅ Password reset successfully! Redirecting to login...', 'success');

                setTimeout(() => {
                    window.location.href = 'login.html?reset=true';
                }, 1500);
            }, 1500);
        });

        /**
         * Clear toast on input focus
         */
        document.querySelectorAll('#forgotForm input').forEach(input => {
            input.addEventListener('focus', function() {
                document.getElementById('toastMessage').classList.remove('show');
            });
        });

        /**
         * Auto-focus email on load
         */
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('email').focus();
        });

        /**
         * Allow only numbers in OTP field
         */
        document.getElementById('otp').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });

        console.log('🔐 RAIL Forgot Password page loaded successfully.');
    </script>

</body>
</html>
