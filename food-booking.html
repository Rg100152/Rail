<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Booking – RAIL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .top-bar {
            background: #0d0d1a;
            color: #adb5bd;
            padding: 10px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .top-bar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .top-bar-left span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-bar-left span i {
            color: #2ecc71;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-bar-right a {
            color: #adb5bd;
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .top-bar-right a:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .top-bar-right .login-btn {
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
            padding: 4px 16px;
            border-radius: 20px;
        }

        .top-bar-right .login-btn:hover {
            background: #2ecc71;
            color: #0d0d1a;
        }

        .top-bar-right .register-btn {
            background: rgba(52, 152, 219, 0.15);
            color: #3498db;
            padding: 4px 16px;
            border-radius: 20px;
        }

        .top-bar-right .register-btn:hover {
            background: #3498db;
            color: #fff;
        }

        .navbar {
            background: #ffffff;
            padding: 14px 0;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.06);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo .logo-icon {
            font-size: 28px;
        }

        .logo .logo-text {
            font-size: 24px;
            font-weight: 900;
            color: #1a1a2e;
        }

        .logo .logo-text span {
            color: #2ecc71;
        }

        .logo small {
            font-size: 10px;
            font-weight: 600;
            color: #6c757d;
            display: block;
            margin-top: -2px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
        }

        .nav-links a {
            color: #1a1a2e;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 40px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.06);
        }

        .nav-links a.active {
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.08);
        }

        .nav-links .nav-login {
            background: #2ecc71;
            color: #fff !important;
            padding: 10px 24px;
        }

        .nav-links .nav-login:hover {
            background: #27ae60;
            box-shadow: 0 8px 24px rgba(46, 204, 113, 0.3);
            color: #fff !important;
        }

        .hamburger {
            display: none;
            font-size: 24px;
            cursor: pointer;
        }

        .page-header {
            text-align: center;
            padding: 40px 20px 30px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin: 20px 0 30px;
        }

        .page-header h1 {
            font-size: 2.4rem;
            font-weight: 800;
        }

        .page-header h1 span {
            color: #ff4757;
        }

        .page-header p {
            color: #6c757d;
            font-size: 1rem;
            margin-top: 4px;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .filter-btn {
            padding: 8px 22px;
            border: 2px solid #e9ecef;
            border-radius: 40px;
            background: #fff;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            color: #1a1a2e;
            font-family: 'Inter', sans-serif;
        }

        .filter-btn:hover {
            border-color: #2ecc71;
        }

        .filter-btn.active {
            background: #ff4757;
            color: #fff;
            border-color: #ff4757;
        }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            margin-top: 10px;
        }

        .food-card {
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .food-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.10);
        }

        .food-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .food-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            margin: -14px 0 0 16px;
            position: relative;
            z-index: 2;
            background: #fff;
            border: 2px solid #e9ecef;
        }

        .food-badge.veg {
            border-color: #2ecc71;
            color: #2ecc71;
        }

        .food-badge.nonveg {
            border-color: #ff4757;
            color: #ff4757;
        }

        .food-badge.bestseller {
            border-color: #f39c12;
            color: #f39c12;
        }

        .food-info {
            padding: 16px 18px 20px;
        }

        .food-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .food-category {
            font-size: 12px;
            color: #6c757d;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .food-desc {
            font-size: 0.85rem;
            color: #6c757d;
            line-height: 1.5;
            margin-bottom: 14px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 40px;
        }

        .food-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .food-price {
            font-size: 1.2rem;
            font-weight: 800;
            color: #1a1a2e;
        }

        .food-price small {
            font-size: 11px;
            font-weight: 500;
            color: #6c757d;
        }

        .btn-order {
            background: #ff4757;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .btn-order:hover {
            background: #e63946;
            transform: scale(1.04);
        }

        .btn-order.added {
            background: #2ecc71;
        }

        .cart-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #0d0d1a;
            color: #fff;
            padding: 14px 24px;
            border-radius: 16px;
            display: none;
            align-items: center;
            gap: 14px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 9999;
            animation: slideUp 0.35s ease;
        }

        .cart-notification.show {
            display: flex;
        }

        .cart-notification .icon {
            color: #2ecc71;
            font-size: 20px;
        }

        .cart-notification .text strong {
            color: #2ecc71;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        footer {
            background: #0d0d1a;
            color: #adb5bd;
            padding: 30px 0 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 50px;
        }

        footer .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 13px;
        }

        footer .links {
            display: flex;
            gap: 16px;
        }

        footer .links a {
            color: #6c757d;
            text-decoration: none;
            transition: 0.2s;
        }

        footer .links a:hover {
            color: #2ecc71;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                padding: 16px 0;
                background: #fff;
                border-radius: 12px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
                margin-top: 12px;
            }

            .nav-links.active {
                display: flex;
            }

            .navbar .container {
                flex-wrap: wrap;
            }

            .hamburger {
                display: block;
            }

            .nav-links a {
                width: 100%;
                text-align: center;
                padding: 10px;
            }

            .top-bar .container {
                flex-direction: column;
                text-align: center;
            }

            .top-bar-left,
            .top-bar-right {
                justify-content: center;
            }

            .page-header h1 {
                font-size: 1.8rem;
            }

            .food-grid {
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }

            .cart-notification {
                bottom: 16px;
                right: 16px;
                left: 16px;
                justify-content: center;
                padding: 12px 18px;
            }
        }

        @media (max-width: 480px) {
            .food-grid {
                grid-template-columns: 1fr;
            }

            .page-header h1 {
                font-size: 1.4rem;
            }

            .filter-btn {
                font-size: 12px;
                padding: 6px 14px;
            }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="container">
            <div class="top-bar-left">
                <span><i class="fas fa-phone"></i> 139</span>
                <span><i class="fas fa-envelope"></i> care@rail.co.in</span>
                <span><i class="fas fa-clock"></i> 24x7 Support</span>
            </div>
            <div class="top-bar-right">
                <a href="login.html" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login</a>
                <a href="register.html" class="register-btn"><i class="fas fa-user-plus"></i> Register</a>
            </div>
        </div>
    </header>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-icon">🚂</span>
                <div>
                    <span class="logo-text">RAIL</span>
                    <small>Indian Railways</small>
                </div>
            </a>

            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">HOME</a></li>
                <li><a href="search.html">SEARCH</a></li>
                <li><a href="food-booking.html" class="active">FOOD</a></li>
                <li><a href="services.html">SERVICES</a></li>
                <li><a href="login.html" class="nav-login">LOG IN</a></li>
            </ul>

            <div class="hamburger" onclick="toggleMenu()">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>🍛 <span>Food</span> Booking</h1>
            <p>Delicious meals delivered to your seat during the journey</p>
            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="veg">🌿 Veg</button>
                <button class="filter-btn" data-filter="nonveg">🍗 Non-Veg</button>
            </div>
        </div>

        <div class="food-grid" id="menuContainer"></div>
    </div>

    <div class="cart-notification" id="cartNotification">
        <span class="icon"><i class="fas fa-check-circle"></i></span>
        <span class="text">Added to cart: <strong id="cartItemName">Item</strong></span>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 RAIL Food Services. All Rights Reserved.</p>
            <div class="links">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Sitemap</a>
            </div>
        </div>
    </footer>

    <script>
        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }

        const foodItems = [
            { id: 1, name: "Palak Paneer", category: "veg", desc: "Fresh paneer in creamy spinach gravy", price: "₹239", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRT_MPPoND1Tu3stx2h4m2Ms5fjh56wKTOr1O9jbHaG0w&s=10" },
            { id: 2, name: "Sweets (Assorted)", category: "veg", desc: "Gulab jamun, rasgulla, jalebi & more", price: "₹149", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbJgU5-MEYy5P0JU1yOYRW_Nfh6-chX6NnMTgyiQJpQg&s=10" },
            { id: 3, name: "Dal Makhani", category: "veg", desc: "Slow cooked black lentils with cream", price: "₹199", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6Lvt2VvoRb3LqRYAufDiu9CNp5KTU1i9PC537MWcHCw&s=10" },
            { id: 4, name: "Aloo Soya", category: "veg", desc: "Spicy potato & soya chunks curry", price: "₹179", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcShvIDwhLvFhipGMqDnvNh-xQtwAqu2f6lHGQk-yUjT0Q&s=10" },
            { id: 5, name: "Chicken Biryani", category: "nonveg", desc: "Fragrant basmati rice with spiced chicken", price: "₹349", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS24zAH2z0GeT8YJ39hCaXGbK2Nu8qDkGQzLjdabaFFwQ&s=10" },
            { id: 6, name: "Litti Chokha", category: "veg", desc: "Bihar's famous baked wheat balls with mashed veggies", price: "₹159", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPOt4fmXRWWt7izjvupJQlzSLgCr8O1UBm1cLjs2PwMA&s=10" },
            { id: 7, name: "Paneer Butter Masala", category: "veg", desc: "Rich creamy paneer in tomato gravy", price: "₹249", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQvzGrrCy41yNBaZMH_XEavos6elg9PsCy3w1ztRDf-Ow&s=10" },
            { id: 8, name: "Gajar Ka Halwa", category: "veg", desc: "Traditional carrot halwa with dry fruits", price: "₹99", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR8dlLuZFOb1hlXJ9IUW9mKMCLMF5blnwmCG9Q3rMlUGQ&s=10" },
            { id: 9, name: "Vada Pav", category: "veg", desc: "Mumbai style spicy potato fritter in bun", price: "₹49", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQFvH_aPDRvt2kalvx0_PXbcfympV5M69trz271O8vtSw&s=10" }
        ];

        function renderItems(items) {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            items.forEach(item => {
                const badge = item.category === 'veg' ? 'veg' : 'nonveg';
                const badgeText = item.category === 'veg' ? '🌿 Veg' : '🍗 Non-Veg';

                const card = document.createElement('div');
                card.className = 'food-card';
                card.innerHTML = `
                    <img src="${item.img}" alt="${item.name}" class="food-img" loading="lazy" />
                    <span class="food-badge ${badge}">${badgeText}</span>
                    <div class="food-info">
                        <div class="food-title">${item.name}</div>
                        <div class="food-category"><i class="fas fa-tag"></i> ${item.category === 'veg' ? 'Vegetarian' : 'Non-Vegetarian'}</div>
                        <p class="food-desc">${item.desc}</p>
                        <div class="food-footer">
                            <span class="food-price">${item.price} <small>per plate</small></span>
                            <button class="btn-order" data-name="${item.name}">
                                <i class="fas fa-plus"></i> Add
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.querySelectorAll('.btn-order').forEach(btn => {
                btn.addEventListener('click', function() {
                    const name = this.getAttribute('data-name');
                    addToCart(name, this);
                });
            });
        }

        let cartTimeout;

        function addToCart(name, btn) {
            const notification = document.getElementById('cartNotification');
            const itemName = document.getElementById('cartItemName');

            btn.innerHTML = '<i class="fas fa-check"></i> Added';
            btn.classList.add('added');

            itemName.textContent = name;
            notification.classList.add('show');

            clearTimeout(cartTimeout);
            cartTimeout = setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-plus"></i> Add';
                    btn.classList.remove('added');
                }, 300);
            }, 2500);
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const filter = this.getAttribute('data-filter');
                let filtered = [];

                if (filter === 'all') {
                    filtered = foodItems;
                } else if (filter === 'veg') {
                    filtered = foodItems.filter(item => item.category === 'veg');
                } else if (filter === 'nonveg') {
                    filtered = foodItems.filter(item => item.category === 'nonveg');
                }

                renderItems(filtered);
            });
        });

        document.addEventListener('DOMContentLoaded', function() {
            renderItems(foodItems);
        });
    </script>

</body>
</html>
